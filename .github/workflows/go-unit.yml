name: Unit tests
on:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Show Go toolchain
        run: |
          go version
          go env GOVERSION GOTOOLCHAIN
      - name: Tests
        run: |
          make test
